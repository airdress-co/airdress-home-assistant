# Run with `prek run --all-files` (or pre-commit). CI runs the same.
# Hook revisions are pinned by commit SHA; the tag each one is sits beside it.
# `prek install` installs the commit-msg hook as well as the pre-commit one.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # Commit messages are conventional commits: release-please reads them to
  # choose the next version and write CHANGELOG.md. CI runs the same checker
  # over a PR's title and commits (scripts/conventional-commits.sh, which
  # names this version and these types too). Locally a merge or a fixup!
  # commit passes; CI's check is strict and refuses a fixup! left in a PR.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args: [build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Core writes en.json without a final newline; the snapshot and what is
        # generated from it stay byte-for-byte what core produced.
        exclude: /translations/en\.json$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Core's ruff rules (pyproject.toml, tests/ruff.toml). Keep this version and
  # RUFF_VERSION in scripts/generate.py the same: the generator formats the
  # generated tests with it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # frozen: v0.16.8
    hooks:
      - id: ruff-check
        exclude: ^upstream/
      - id: ruff-format
        exclude: ^upstream/

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc # frozen: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: generated
        name: generated files match upstream/ + overlay/
        entry: python3 scripts/generate.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy with core's settings over custom_components/airdress
        # Core's settings for this integration (pyproject.toml says where each
        # comes from). Type-checks against the Home Assistant release the
        # tests run on, so it runs in the tests' environment; uv caches it
        # after the first run. CI also runs it against Home Assistant dev.
        entry: uv run --quiet --no-project --python 3.14 --with-requirements requirements_test.txt mypy
        language: system
        pass_filenames: false
        files: ^(custom_components/airdress/.+\.py|stubs/.+|mypy_plugins/.+|pyproject\.toml|requirements_test\.txt)$

      - id: no-internal-refs
        name: no internal document numbers
        # This repository is public: internal process identifiers (design,
        # runbook and research-record numbers) must not appear in it.
        entry: '(?i)\b(spec|rb|rdr|rcp)[_-]?[0-9]{3}\b'
        language: pygrep
        exclude: ^(\.pre-commit-config\.yaml|.*\.png)$

      - id: no-ai-attribution
        name: no AI tool references
        entry: '(?i)\b(claude|anthropic|copilot co-authored)\b'
        language: pygrep
        exclude: ^(\.pre-commit-config\.yaml|.*\.png)$
