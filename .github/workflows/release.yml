# Publishes a GitHub release for a `vX.Y.Z` (or `vX.Y.ZbN`) tag, which is what
# HACS installs. A pre-release version becomes a GitHub pre-release, shown in
# HACS only to users who opt in to betas.
#
# It refuses a tag whose version is not the manifest's, and a manifest whose
# pinned library is not on PyPI: Home Assistant installs that requirement when
# it loads the integration, so a release without it would install and then
# fail to load for everyone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - name: The generated files match upstream/ + overlay/
        run: python3 scripts/generate.py --check
      - name: The tag names the manifest version
        run: |
          version=$(jq -r .version custom_components/airdress/manifest.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: The pinned library is on PyPI
        run: |
          requirement=$(jq -r '.requirements[0]' custom_components/airdress/manifest.json)
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python --no-deps --index-url https://pypi.org/simple "$requirement"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}"
