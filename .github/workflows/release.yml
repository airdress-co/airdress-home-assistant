# Publishes a GitHub release for a `vX.Y.Z` (or `vX.Y.Z-bN`) tag, which is what
# HACS installs. A pre-release version becomes a GitHub pre-release, shown in
# HACS only to users who opt in to betas.
#
# release-please makes the tag when its release PR is merged
# (release-please.yml), with a draft release; this publishes that draft once
# the checks below pass. A tag pushed by hand gets a new release instead.
#
# It refuses a tag whose version is not the manifest's, and a manifest whose
# pinned library is not on PyPI: Home Assistant installs that requirement when
# it loads the integration, so a release without it would install and then
# fail to load for everyone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - name: The generated files match upstream/ + overlay/
        run: python3 scripts/generate.py --check
      # Compared as PEP 440 versions, so that the older `v0.1.0b3` spelling
      # and release-please's `v0.1.0-b4` both work.
      - name: The tag names the manifest version
        run: |
          version=$(jq -r .version custom_components/airdress/manifest.json)
          if ! uv run --quiet --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; sys.exit(Version(sys.argv[1]) != Version(sys.argv[2]))' \
            "${GITHUB_REF_NAME#v}" "$version"; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: The pinned library is on PyPI
        run: |
          requirement=$(jq -r '.requirements[0]' custom_components/airdress/manifest.json)
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python --no-deps --index-url https://pypi.org/simple "$requirement"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft || true)
          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}"
          fi
