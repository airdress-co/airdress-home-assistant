name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest move with Home Assistant; catch that before a user does.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release-please reads the history to choose the next version and write the
  # changelog, so every commit a PR brings must be a conventional commit: PRs
  # are merged by rebase, and those commits are what lands on main. The title
  # is held to the same form. The same check as the commit-msg hook in
  # .pre-commit-config.yaml, at the same version.
  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/conventional-commits.sh

  # ruff (core's rules), mypy --strict and the generated-files check all run
  # as prek hooks; see .pre-commit-config.yaml.
  prek:
    name: Pre-commit (prek), including the generated-files check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uvx prek run --all-files --show-diff-on-failure

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # The brands check looks for the domain in home-assistant/brands.
          # This integration ships its images in custom_components/airdress/brand
          # instead, which Home Assistant serves for a custom integration.
          ignore: brands

  test:
    name: Tests (released Home Assistant)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv venv
      - run: uv pip install -r requirements_test.txt
      # pyproject.toml sets the gate: 100% of custom_components/airdress.
      - run: .venv/bin/python -m pytest -q --cov --cov-report=term
